# SPDX-License-Identifier: GPL-2.0-only
# Modified in the personal fork on 2026-11-02: run release-branch Windows checks and discover actual WSLg capabilities before publication.
# Created in the personal fork on 2026-11-01: compile the Windows bootstrapper and exercise isolated selection tests on Windows.
name: Windows installer
on:
  workflow_call:
  push:
    branches: ['release/**']
  workflow_dispatch:
  pull_request:
    paths: ['packaging/windows/**', 'scripts/install-release.ps1', 'tests/windows*.ps1']
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: PowerShell 7 regression and selection tests
        shell: pwsh
        run: |
          ./tests/windows-installer.ps1
          ./tests/windows-distributions.ps1
          ./tests/windows-core.ps1
      - name: Windows PowerShell 5.1 regression and selection tests
        shell: powershell
        run: |
          ./tests/windows-installer.ps1
          ./tests/windows-distributions.ps1
          ./tests/windows-core.ps1
      - name: Compile framework desktop application
        run: dotnet build packaging/windows/ASEStudioSetup.csproj -c Release -o windows-installer
      - name: Preserve reviewable installer bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer-unsigned
          path: windows-installer/
          if-no-files-found: error
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/appimage-inputs
          key: appimage-inputs-${{ hashFiles('packaging/appimage/*.lock.json') }}
      - name: Build from authenticated pinned inputs
        run: |
          python3 scripts/fetch-engine.py --target ubuntu-22.04-x86_64 --output "$RUNNER_TEMP/engine"
          python3 scripts/build-appimage.py --sdk "$RUNNER_TEMP/engine" --inputs "$RUNNER_TEMP/appimage-inputs" --work "$RUNNER_TEMP/appimage"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-appimage-candidate
          compression-level: 0
          path: |
            ${{ runner.temp }}/appimage/*.AppImage
            ${{ runner.temp }}/appimage/SHA256SUMS
            ${{ runner.temp }}/appimage/build/report.json
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/appimage-sources
          key: appimage-sources-${{ hashFiles('packaging/appimage/*sources.lock.json', 'scripts/frontend-sources.lock.json') }}
      - name: Collect corresponding sources for a tagged release
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/appimage-release-sources.py --sdk "$RUNNER_TEMP/engine" --build "$RUNNER_TEMP/appimage" --cache "$RUNNER_TEMP/appimage-sources" --output "$RUNNER_TEMP/appimage-release"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-appimage-sources
          path: ${{ runner.temp }}/appimage-release/
          compression-level: 0
          retention-days: 1
  wsl-desktop:
    needs: [installer, appimage]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: managed-appimage-candidate
          path: runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-installer-unsigned
          path: setup
      - name: Real WSLg activation, Start launch and offline uninstall
        shell: pwsh
        run: ./tests/windows-appimage.ps1 -Image runtime/ASE-Studio-experimental-x86_64.AppImage -Installer setup -Output results
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-appimage-evidence
          path: results/
          if-no-files-found: warn
