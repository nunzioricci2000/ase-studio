# SPDX-License-Identifier: GPL-2.0-only
# Modified in the personal fork on 2026-10-31: verify Windows 10/11 installer eligibility in PowerShell 7 and Windows PowerShell 5.1 before WSL checks.
# Modified in the personal fork on 2026-10-30: authenticate source-paired macOS runtime bottles before packaging.
# Created in the personal fork on 2026-10-28: package and test Studio against pinned prebuilt engines.
# Modified in the personal fork on 2026-10-28: build and exercise native macOS application bundles too.
# Modified in the personal fork on 2026-10-28: retain administrative executable paths in Debian/Ubuntu containers.
# Modified in the personal fork on 2026-10-28: rebuild supplied sources and test the Ubuntu desktop package under Windows WSL2.
# Modified in the personal fork on 2026-10-28: finish development validation and keep automatic packaging on main pushes.
# Modified in the personal fork on 2026-10-28: aggregate target evidence and create verified source-paired draft releases from stable tags.
# Modified in the personal fork on 2026-10-30: publish checksum-verified standalone installers and a target index in draft releases.
# Modified in the personal fork on 2026-10-30: identify named fork drafts explicitly as stable releases.
name: Build Studio packages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: all, or IDs with verified SDKs in scripts/engine-sdks.lock.json
        default: all
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-packages-${{ github.ref }}-${{ inputs.targets || 'all' }}
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/gitflow.py verify-tag
      - id: plan
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          python3 scripts/fetch-engine.py --matrix "$TARGETS" > "$RUNNER_TEMP/studio-plan.json"
          printf 'matrix=%s\n' "$(cat "$RUNNER_TEMP/studio-plan.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/studio-dependency-sources
          key: studio-sources-${{ hashFiles('scripts/frontend-sources.lock.json', 'scripts/macos-runtime.lock.json', 'package-lock.json') }}
      - name: Verify preferred frontend sources once per workflow
        run: |
          python3 scripts/frontend-sources.py --output "$RUNNER_TEMP/studio-dependency-sources"
          python3 scripts/macos_runtime.py --output "$RUNNER_TEMP/studio-dependency-sources"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-dependency-sources
          path: ${{ runner.temp }}/studio-dependency-sources/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  package:
    needs: sources
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sources.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: studio-dependency-sources
          path: ${{ runner.temp }}/studio-dependency-sources
      - name: Download and verify the existing engine and its sources
        env:
          TARGET: ${{ matrix.id }}
        run: python3 scripts/fetch-engine.py --target "$TARGET" --output "$RUNNER_TEMP/engine-input"
      - name: Build and exercise the Linux desktop package
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.image }}
          FAMILY: ${{ matrix.family }}
          VERIFY_SOURCES: ${{ matrix.id == 'ubuntu-24.04-x86_64' }}
        run: |
          mkdir -p "$RUNNER_TEMP/studio-output"
          node_prefix=$(dirname "$(dirname "$(command -v node)")")
          docker run --rm \
            -e FAMILY -e VERIFY_SOURCES -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e HOME=/tmp/studio-home -e PATH=/opt/studio-node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            -v "$node_prefix:/opt/studio-node:ro" \
            -v "$RUNNER_TEMP/engine-input:/engine-input:ro" \
            -v "$RUNNER_TEMP/studio-dependency-sources:/dependency-sources:ro" \
            -v "$RUNNER_TEMP/studio-output:/output" \
            "$IMAGE" bash -c '
              set -euo pipefail
              bash scripts/runtime-dependencies.sh "$FAMILY"
              groupadd -g "$HOST_GID" studio
              useradd -u "$HOST_UID" -g "$HOST_GID" -d "$HOME" -m studio
              runuser -u studio -- python3 scripts/package.py \
                --sdk-artifact /engine-input --dependency-sources /dependency-sources --output /output
              if [[ "$VERIFY_SOURCES" == true ]]; then
                runuser -u studio -- python3 scripts/rebuild-source.py --sdk-artifact /engine-input \
                  --package-output /output --output /output/source-rebuild
              fi
            '
      - name: Build and exercise the native macOS application
        if: runner.os == 'macOS'
        run: |
          bash scripts/runtime-dependencies.sh macos
          python3 scripts/package.py --sdk-artifact "$RUNNER_TEMP/engine-input" \
            --dependency-sources "$RUNNER_TEMP/studio-dependency-sources" --output "$RUNNER_TEMP/studio-output"
          python3 scripts/rebuild-source.py --sdk-artifact "$RUNNER_TEMP/engine-input" \
            --package-output "$RUNNER_TEMP/studio-output" --output "$RUNNER_TEMP/studio-output/source-rebuild"
      - name: Verify generated frontend and source cleanliness
        run: |
          git diff --check
          git diff --exit-code -- frontend/vendor
      - name: Keep source-paired tested packages
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/studio-output/*.tar.gz
            ${{ runner.temp }}/studio-output/*.zip
            ${{ runner.temp }}/studio-output/SHA256SUMS
            ${{ runner.temp }}/studio-output/report.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Keep timestamps and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-report-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/studio-output/
            !${{ runner.temp }}/studio-output/*.tar.gz
            !${{ runner.temp }}/studio-output/*.zip
            ${{ runner.temp }}/engine-input/fetch-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Summarize package measurements
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/studio-output/report.md" ]]; then
            cat "$RUNNER_TEMP/studio-output/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
  windows-wsl:
    needs: [sources, package]
    if: contains(needs.sources.outputs.matrix, 'ubuntu-24.04-x86_64')
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: studio-ubuntu-24.04-x86_64
          path: artifact
      - name: Check Windows installer eligibility (PowerShell 7)
        shell: pwsh
        run: ./tests/windows-installer.ps1
      - name: Check Windows installer eligibility (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/windows-installer.ps1
      - name: Test installed Studio in WSL2 with a disposable display
        shell: pwsh
        run: ./scripts/wsl-test.ps1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-report-windows-wsl2-x86_64
          path: ${{ runner.temp }}/studio-wsl-report/
          retention-days: 30
          if-no-files-found: warn
  report:
    if: always() && needs.sources.result == 'success'
    needs: [sources, package, windows-wsl]
    runs-on: ubuntu-24.04
    outputs:
      release_ready: ${{ steps.report.outputs.release_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: studio-report-*
          path: artifacts
      - name: Capture selected targets and GitHub job timestamps
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_MATRIX: ${{ needs.sources.outputs.matrix }}
        run: |
          mkdir -p report
          printf '%s\n' "$TARGET_MATRIX" > report/build-plan.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > report/actions-jobs.json
      - name: Aggregate runtime, source-rebuild and timing evidence
        id: report
        run: |
          python3 scripts/package-report.py --artifacts artifacts --matrix report/build-plan.json \
            --jobs report/actions-jobs.json --output report
          cat report/build-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: studio-build-report
          path: report/
          retention-days: 90
          if-no-files-found: warn
  draft-release:
    environment: release-signing
    if: startsWith(github.ref, 'refs/tags/') && needs.report.outputs.release_ready == 'true'
    needs: report
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: studio-*
          path: artifacts
      - name: Recheck every application/source archive and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          python3 scripts/package-report.py --artifacts artifacts --output artifacts/studio-build-report --verify-release
          umask 077
          export ASE_RELEASE_SIGNING_KEY_FILE="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$ASE_RELEASE_SIGNING_KEY_FILE"' EXIT
          test -n "$RELEASE_SIGNING_KEY"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$ASE_RELEASE_SIGNING_KEY_FILE"
          unset RELEASE_SIGNING_KEY
          python3 scripts/release-assets.py --artifacts artifacts --output artifacts/studio-build-report \
            --version "$TAG" --revision "$GITHUB_SHA"
          mapfile -t files < artifacts/studio-build-report/release-files.txt
          files+=(
            artifacts/studio-build-report/build-report.json artifacts/studio-build-report/build-report.md
            artifacts/studio-build-report/actions-jobs.json artifacts/studio-build-report/SHA256SUMS)
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease=false \
            --title "ASE Studio di Nunzio $TAG" --notes-file artifacts/studio-build-report/build-report.md
